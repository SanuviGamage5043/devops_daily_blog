---
- name: Stop old containers
  docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - blogapp_front
    - blogapp_back

- name: Run backend container
  docker_container:
    name: blogapp_back
    image: sanuvi5043/blogapp-backend:latest
    state: started
    restart_policy: always
    published_ports:
      - "5000:5000"
    env:
      MONGO_URL: "mongodb+srv://<username>:<password>@<cluster-url>/blogdb?retryWrites=true&w=majority"

- name: Run frontend container
  docker_container:
    name: blogapp_front
    image: sanuvi5043/blogapp-frontend:latest
    state: started
    restart_policy: always
    published_ports:
      - "3000:3000"
    links:
      - blogapp_back:backend