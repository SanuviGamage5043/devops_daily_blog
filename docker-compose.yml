version: "3.9"

services:

  backend:
    image: sanuvi5043/blogapp-backend
    container_name: blog-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    image: sanuvi5043/blogapp-frontend
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "80:80"